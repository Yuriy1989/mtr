services:
  postgres:
    image: postgres:16-alpine
    container_name: mtr-postgres
    env_file:
      - ./.env.db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - mtr-net
    restart: unless-stopped

networks:
  mtr-net:
    driver: bridge